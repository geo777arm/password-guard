<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="28" height="28">
    <div class="title">
      <h1>Password Guard</h1>
      <span class="subtitle" data-i18n="subtitle"></span>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><span class="num" id="checked">0</span><span class="label" data-i18n="checked"></span></div>
    <div class="stat bad"><span class="num" id="leaked">0</span><span class="label" data-i18n="leaked"></span></div>
    <div class="stat"><span class="num" id="reused">0</span><span class="label" data-i18n="reused"></span></div>
  </section>

  <section class="card generator">
    <div class="section-head">
      <span class="card-title" data-i18n="generator"></span>
      <div class="segmented" role="group">
        <button data-mode="random" data-i18n="modeRandom"></button><button data-mode="words" data-i18n="modeWords"></button>
      </div>
    </div>
    <div class="section-head">
      <span class="length-value"><span id="length-value">16</span> <span id="length-unit"></span></span>
    </div>
    <input type="range" id="length" min="8" max="32" value="16">
    <div class="output-row">
      <textarea id="generated" rows="1" readonly></textarea>
      <button id="copy" class="ghost" data-i18n="copy"></button>
    </div>
    <button id="generate" class="primary" data-i18n="generate"></button>
    <p id="generator-hint" class="gen-hint"></p>
  </section>

  <footer>
    <p class="privacy" data-i18n="privacy"></p>
    <button id="reset" class="link" data-i18n="reset"></button>
  </footer>

  <script src="i18n.js"></script>
  <script src="words.js"></script>
  <script src="generator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
